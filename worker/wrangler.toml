name       = "matm-publicist"
main       = "matm-publicist.js"
compatibility_date = "2024-01-01"

# No R2 bindings needed — files are fetched from the public R2 URL.
# Add RESEND_API_KEY as a secret via the Cloudflare dashboard or:
#   npx wrangler secret put RESEND_API_KEY

# Rate limiting: max 3 requests per 60 seconds per visitor IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "999"   # matches the binding created in the Cloudflare dashboard
simple = { limit = 3, period = 60 }
